<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandune Monitor</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="app-header">
  <div class="brand-row">
    <h1>Sandune Monitor</h1>
    <div class="header-tools">
      <div class="price-toggle" role="group" aria-label="Price source">
        <button type="button" class="seg" data-price-mode="live" aria-pressed="true">Live</button>
        <button type="button" class="seg" data-price-mode="seed" aria-pressed="false" id="price-seed">Seed</button>
        <span class="price-status muted" id="price-status" role="status"></span>
      </div>
      <button type="button" class="btn" id="reset">Reset to Sample Data</button>
    </div>
  </div>
  <p class="banner" role="note">Sample data. All holdings, investments and figures are illustrative.</p>
  <nav class="nav-top" role="tablist" aria-label="Sections">
    <button type="button" role="tab" id="secbtn-opportunities" data-section="opportunities" aria-selected="true">Opportunities</button>
    <button type="button" role="tab" id="secbtn-portfolio" data-section="portfolio" aria-selected="false" tabindex="-1">Portfolio</button>
  </nav>
  <nav class="nav-sub" role="tablist" aria-label="Opportunities views" data-section="opportunities">
    <button type="button" role="tab" id="tabbtn-themes" data-tab="opportunities/themes" aria-controls="tab-themes" aria-selected="true">Themes</button>
    <button type="button" role="tab" id="tabbtn-ideas" data-tab="opportunities/ideas" aria-controls="tab-ideas" aria-selected="false" tabindex="-1">Ideas</button>
  </nav>
  <nav class="nav-sub" role="tablist" aria-label="Portfolio views" data-section="portfolio" hidden>
    <button type="button" role="tab" id="tabbtn-blotter" data-tab="portfolio/blotter" aria-controls="tab-blotter" aria-selected="false" tabindex="-1">Investment Blotter</button>
    <button type="button" role="tab" id="tabbtn-portfolio" data-tab="portfolio/current" aria-controls="tab-portfolio" aria-selected="true">Current</button>
    <button type="button" role="tab" id="tabbtn-proforma" data-tab="portfolio/proforma" aria-controls="tab-proforma" aria-selected="false" tabindex="-1">Pro Forma Analysis</button>
  </nav>
</header>

<main>
  <div id="sec-opportunities">
  <section id="tab-themes" role="tabpanel" aria-labelledby="tabbtn-themes" hidden>
    <section class="card" aria-labelledby="th-h">
      <div class="card-header"><h2 id="th-h">Themes</h2></div>
      <div id="th-grid" class="theme-bars"></div>
    </section>
    <div id="th-card" class="card-slot"></div>
  </section>

  <section id="tab-ideas" role="tabpanel" aria-labelledby="tabbtn-ideas" hidden>
    <section class="card" aria-labelledby="inv-h">
      <div class="card-header"><h2 id="inv-h">Prospective Investments</h2></div>
      <div id="id-intake"></div>
      <div class="filters" id="id-filters"></div>
      <div class="table-wrap">
        <table class="grid ideas" id="id-table"></table>
      </div>
    </section>
    <div id="id-card" class="card-slot"></div>

    <section class="card" aria-labelledby="done-h">
      <div class="card-header"><h2 id="done-h">Completed Investments</h2></div>
      <div id="id-completed"></div>
    </section>
    <div id="id-card-completed" class="card-slot"></div>

    <details class="card passed" id="id-passed">
      <summary>Passed</summary>
      <div id="id-passed-list"></div>
    </details>
    <div id="id-card-passed" class="card-slot"></div>
  </section>
  </div>

  <section id="tab-portfolio" role="tabpanel" aria-labelledby="tabbtn-portfolio" hidden>
    <div class="tiles" id="pf-tiles"></div>
    <div class="card dp-build" id="pf-dp-build" hidden></div>

    <div class="charts">
      <figure class="card">
        <figcaption>Exposure by Asset Class, % of NAV</figcaption>
        <div class="chart-box"><canvas id="pf-chart-class" role="img" aria-label="Horizontal bar chart of exposure by asset class as a percent of NAV."></canvas></div>
      </figure>
      <figure class="card">
        <figcaption>Exposure by Sector, % of NAV ex-Cash</figcaption>
        <div class="chart-box"><canvas id="pf-chart-sector" role="img" aria-label="Horizontal bar chart of exposure by sector as a percent of NAV, excluding cash."></canvas></div>
      </figure>
      <figure class="card card-wide">
        <figcaption title="Ladder = cash and T-bills + holdings liquid by that date − cumulative capital calls. Calls follow each fund's call schedule, straight-line over 3 years when none is set.">Liquidity Ladder and Projected Capital Calls, Next 5 Years ($M)</figcaption>
        <div class="chart-sub">Liquidity ladder</div>
        <div class="chart-box chart-ladder"><canvas id="pf-chart-ladder" role="img" aria-label="Line chart of the liquidity ladder from now through year 5, in $M."></canvas></div>
        <div class="chart-sub">Projected capital calls</div>
        <div class="chart-box chart-calls"><canvas id="pf-chart-calls" role="img" aria-label="Bar chart of projected capital calls for years 1 to 5, in $M, on the same year axis as the ladder above."></canvas></div>
      </figure>
    </div>

    <div id="pf-holdings" class="hc-stack" aria-label="Holdings by asset class"></div>
  </section>

  <section id="tab-blotter" role="tabpanel" aria-labelledby="tabbtn-blotter" hidden>
    <section class="card" aria-labelledby="bl-h" id="pf-blotter">
      <div class="card-header">
        <h2 id="bl-h">Investment Blotter</h2>
        <div class="card-actions">
          <button type="button" class="btn" id="bl-new" aria-expanded="false" aria-controls="bl-form">New Entry</button>
          <button type="button" class="btn" id="bl-csv">Export CSV</button>
        </div>
      </div>
      <div id="bl-form" hidden></div>
      <div class="filters bl-filters" id="bl-filters"></div>
      <div class="table-wrap">
        <table class="grid blotter" id="bl-table"></table>
      </div>
    </section>
  </section>

  <section id="tab-proforma" role="tabpanel" aria-labelledby="tabbtn-proforma" hidden>
    <section class="card" aria-labelledby="pf2-sel-h">
      <div class="card-header"><h2 id="pf2-sel-h">Select Prospective Investments</h2></div>
      <div class="table-wrap">
        <table class="grid selector" id="pf2-selector"></table>
      </div>
      <div id="pf2-warnings"></div>
    </section>

    <div class="pf-grid">
      <section class="card pf-main" aria-labelledby="pf2-baf-h">
        <div class="card-header"><h2 id="pf2-baf-h">Current vs Pro Forma</h2></div>
        <div class="table-wrap">
          <table class="grid baf" id="pf2-table"></table>
        </div>
        <div id="pf2-pre" class="pre-breaches"></div>
      </section>
      <aside class="card pf-limits" aria-labelledby="pf2-limits-h">
        <div class="card-header"><h2 id="pf2-limits-h">Limits and Haircuts</h2></div>
        <div id="pf2-limits" class="limits-grid"></div>
      </aside>
    </div>

    <figure class="card">
      <figcaption title="Ladder = cash and T-bills + holdings liquid by that date − cumulative capital calls, before and after the selected trades.">Liquidity Ladder, Before and After ($M)</figcaption>
      <div class="chart-box chart-ladder"><canvas id="pf2-chart-ladder" role="img" aria-label="Line chart of the liquidity ladder before the trade (gray) and after the trade (navy), now through year 5, same axis."></canvas></div>
      <div class="chart-sub">After-trade capital calls</div>
      <div class="chart-box chart-calls"><canvas id="pf2-chart-calls" role="img" aria-label="Bar chart of after-trade projected capital calls, years 1 to 5, aligned with the ladder above."></canvas></div>
    </figure>

    <section aria-labelledby="pf2-hold-h" class="hc-group">
      <div class="group-head">
        <h2 id="pf2-hold-h" class="group-title">Pro Forma Holdings</h2>
        <button type="button" class="btn" id="pf2-hold-toggle" aria-expanded="false" aria-controls="pf2-holdings">Show Pro Forma Holdings</button>
      </div>
      <div id="pf2-holdings" class="hc-stack" hidden></div>
    </section>
  </section>
</main>

<script src="vendor/chart.umd.min.js"></script>
<script src="data/seed.js"></script>
<script src="js/metrics.js"></script>
<script src="js/positions.js"></script>
<script src="js/format.js"></script>
<script src="js/migrate.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/prices.js"></script>
<script src="js/holdings.js"></script>
<script src="js/blotter.js"></script>
<script src="js/portfolio.js"></script>
<script src="samples/sample-om-extracted.js"></script>
<script src="js/proforma-model.js"></script>
<script src="js/invest-model.js"></script>
<script src="js/status-model.js"></script>
<script src="js/themes-model.js"></script>
<script src="js/intake.js"></script>
<script src="js/ideas.js"></script>
<script src="js/proforma.js"></script>
<script src="js/app.js"></script>
</body>
</html>
